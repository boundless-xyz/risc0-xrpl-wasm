[package]
name = "risc0-verifier-xrpl-wasm"
version = "0.1.0"
edition = "2024"
description = "RISC Zero verifier for XRPL Wasm"
license = "Apache-2.0"
readme = "README.md"

[features]
default = []
std = []

[dependencies]
hex-literal = "1.1.0"
sha2 = { version = "0.10", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
xrpl-wasm-stdlib = { git = "https://github.com/ripple/xrpl-wasm-stdlib", tag = "v0.7.1" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = { workspace = true }
risc0-zkvm = { version = "3.0.4", default-features = false }

[build-dependencies]
risc0-circuit-recursion = { version = "4.0.2", default-features = false }

[dev-dependencies]
test-utils = { path = "test-utils" }

serde_json = { workspace = true }
serial_test = { workspace = true }
anyhow = { workspace = true }
hex = "0.4"

############################################################################

[workspace]

members = [
    ".",
    "test-utils",
    "examples/risc0_verify_simple",
    "examples/groth16_verify_simple",
    "examples/risc0_verify_proof_from_memo",
    "examples/risc0_verify_everything_from_memo",
]

[workspace.dependencies]
risc0-verifier-xrpl-wasm = { path = ".", default-features = false}
xrpl-wasm-stdlib = { git = "https://github.com/ripple/xrpl-wasm-stdlib", tag = "v0.7.1" }

anyhow = "1"
serial_test = "3.3"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
