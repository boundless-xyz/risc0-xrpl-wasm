name: publish

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install rust
        uses: dtolnay/rust-toolchain@stable

      - name: dry run
        run: cargo publish --dry-run

      - name: publish to crates.io
        run: cargo publish
